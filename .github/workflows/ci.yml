name: lint-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-and-ros:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Create ROS-compatible Python environment
        shell: bash
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Install ROS dependencies
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          if [[ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]]; then
            sudo rosdep init
          fi
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -r -y --rosdistro jazzy
          # rosdep only scans src/. The root-level tests import tools/, which is
          # not a colcon package, so nothing declares what it needs -- and a
          # missing module there fails pytest at COLLECTION, taking the whole
          # suite down rather than one test. Declared explicitly:
          #   nav2_msgs  <- tools/corridor_nav_gate.py (NavigateToPose)
          #   tf2_ros    <- tools/corridor_nav_gate.py, tools/wait_for_tf.py
          sudo apt-get install -y --no-install-recommends \
            ros-jazzy-nav2-msgs ros-jazzy-tf2-ros-py

      - name: Lint, test, and build workspace
        run: bash tools/check_workspace.sh
