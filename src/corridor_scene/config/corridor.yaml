schema_version: 0.5.0
status: topology_reconciled_metric_scale_demo_assumption

provenance:
  source_document: docs/ROBO_TASK.pdf
  topology: reconciled_with_supplied_diagram
  metric_scale: demo_assumption
  note: >-
    The supplied drawing labels the corridor widths only as the symbols m and n
    and carries no scale bar or dimension text. Every metric length below is an
    explicit project choice, not a surveyed value recovered from the diagram.
    What the diagram does fix is topology: one straight corridor face and one
    tapering face, a perpendicular next street, B farther along that street, and
    P at its corner.

stage:
  up_axis: Z
  meters_per_unit: 1.0
  default_prim: /World

geometry:
  # The supplied drawing shows a straight north face and a sloping south face,
  # so the taper is carried entirely by the south wall.
  taper_mode: one_sided_south
  corridor_length_m: 12.0
  building_height_m: 4.0
  wall_thickness_m: 0.5
  west_margin_m: 2.0
  next_street:
    clear_width_m: 6.0
    # 20.0, from 10.0. The street grows SOUTHWARD, and southward is exactly
    # where A was getting stuck: the south wall sat at y = -4.2 at robot scale
    # and A stopped against it at y = -4.04 and y = -4.31 on the two runs that
    # reached B. Moving that wall out leaves 6.72 m of open street south of B
    # instead of 0.84 m -- room to turn, and room for the lidar to see B from
    # several metres rather than from inside a pocket.
    #
    # This is the only street knob that is free: `clear_width_m` is capped at
    # ~6.198 by test_trajectory.py:307-329, and it, `turn_radius_m`,
    # `b_distance_m` and `corridor_length_m` each move the pinned route legs
    # (test_route_legs_are_pinned, 24.601 m). Length alone leaves them.
    length_m: 20.0
    turn_radius_m: 2.0
    b_distance_m: 8.0
    # B's lateral position across the street, measured from the drawing: the
    # label centres 0.7989 of the way across the clear channel, which puts B in
    # the stub's shadow against the east wall rather than out in the lane.
    b_lateral_fraction: 0.7989
    # The unlabelled block the drawing puts on the east wall beside B. It was
    # measured and deliberately left out until ADR 0018; modelling it makes B
    # stand in the pocket behind it, which is where the drawing puts B.
    #
    # Only the *ratios* transfer. The drawing's own scale gives a 43.4 m
    # corridor and B at 20.3 m against the scene's 12.0 and 8.0, so the
    # along-street position is a project choice (ADR 0010). The depth transfers
    # as a fraction of the street rather than through the `m` arrow, because
    # the two disagree and the fraction is what decides whether A can pass.
    east_wall_stub:
      # Measured: 166 px of the 358 px clear channel.
      depth_fraction: 0.4637
      # Measured: 63 px at the stub's own 2.635:1 aspect.
      length_m: 1.06
      # Project choice, preserving the drawn "B immediately south of it".
      gap_north_of_b_m: 1.05
  profiles:
    nominal_m6_n3:
      # Left at the authored 6.0/3.0 deliberately. Narrowing the corridor by
      # editing these instead of by the scale factor changes the scenario's
      # RATIOS, and the geometric arguments are built on those: doing it broke
      # the ADR 0019 occlusion certificate outright (P visible along the whole
      # approach and arc) and moved the pinned route legs. The corridor is
      # narrowed by the uniform scale factor instead, which preserves every
      # ratio by construction.
      entry_width_m: 6.0
      corner_width_m: 3.0
      default: true
    wide_corner_m6_n4_5:
      entry_width_m: 6.0
      corner_width_m: 4.5
    uniform_m6_n6:
      entry_width_m: 6.0
      corner_width_m: 6.0

camera:
  count: 1
  frame_id: p_cam_optical_frame
  width_px: 640
  height_px: 360
  rate_hz: 15.0
  horizontal_fov_deg: 75.0
  mount_height_m: 0.7

fiducials:
  dictionary: DICT_5X5_100
  # The 40 cm code gives a 5x5 tag plus border at least ~45 px in the
  # qualified 640x360 oblique views. GPU qualification showed that the earlier
  # 24 cm prototype was undersampled and its canted plate was mounted too close
  # to the wall; both defects are covered by scene-generation tests.
  marker_size_m: 0.40
  first_station_m: 2.0
  spacing_m: 2.0
  wall_plate_cant_deg: 35.0
  # Far-field reference plates. Past camera x ~ 7.5 the corridor wall markers
  # leave the 75 deg frustum, so gates 8.0 and 10.0 produced no estimate and the
  # 0.8 m/s corner rule was unreachable. These restore coverage.
  #
  # Sizes and heights were measured, not chosen. Larger plates are worse: they
  # collide in-image and clip. Placing them at one height is worse still,
  # because plates receding along a wall telescope into a contiguous strip and
  # each nearer one paints over the farther one's ArUco quiet zone. Staggering
  # the heights is what makes them decode together.
  #
  # `along_m` is x on the north wall and y on the east face. The east face
  # spans y up to the north wall at m/2, so it *shortens* with a narrower
  # entry width: the plate at 2.2 fitted the configured m = 6.0 and overhung
  # into the adjoining building at m = 5.5. At 1.8 the backing reaches
  # y = 2.4429, so every entry width down to m = 4.886 is admissible, which
  # covers the declared m >= 5.0 support floor. A sweep of 1.0 .. 2.2 changed
  # neither coverage (164/163/162 accepted frames, all four gates) nor speed
  # error; only the admissible width range moves, so range decided it.
  references:
    id_base: 80
    plates:
      - {surface: north_wall, along_m: 13.0, height_m: 0.9, size_m: 0.60, cant_deg: 35.0}
      - {surface: north_wall, along_m: 15.0, height_m: 2.0, size_m: 0.60, cant_deg: 35.0}
      # Moved from 17.0 by ADR 0019: the corner screen that hides P now
      # occupies x=[16.5, 16.9] at this same wall height band, and 17.0 sat
      # inside its shadow from the approach. 15.9 keeps this plate's backing
      # clear of both the screen and the previous plate's backing.
      - {surface: north_wall, along_m: 15.9, height_m: 3.1, size_m: 0.60, cant_deg: 35.0}
      # Lowered from 1.8 by ADR 0019, for the same reason as the north-wall
      # plate above: at 1.8 the backing's top edge (2.443) sat inside the
      # corner screen's height band on every profile, deepest on the least
      # tapered ones. `max(along_m, band_floor)` already clamps this per
      # profile to clear the corner mass, so a low, even negative, nominal
      # value here lets that existing mechanism place it, rather than pinning
      # a value that only clears one specific profile's screen.
      - {surface: east_face,  along_m: -0.6, height_m: 2.6, size_m: 1.00, cant_deg: 0.0}
      # The lower east plate must also clear the corner mass, whose north edge
      # sits at m/2 - n: exactly y = 0.0 on the default profile. Centred there,
      # half of it was behind the corner building -- invisible to a
      # projection-only synthetic camera, and half-clipped in a real render.
      # Moved to 0.75 and shrunk to 0.60 m, which measured strictly better than
      # the occluded original on every metric: zero occluded frames, and worst
      # station and speed error both lower across all three profiles.
      #
      # Lowered again from 0.75 by ADR 0019, for the same corner-screen
      # conflict as the plate above -- at 0.75 its top edge sat inside the
      # screen's height band on the least tapered profiles. The band-floor
      # clamp keeps it clear of the corner mass exactly as before.
      - {surface: east_face,  along_m: 0.05, height_m: 1.0, size_m: 0.60, cant_deg: 0.0}

actors:
  # Actor body sizes, config-driven for the same reason P's is (ADR 0010:
  # topology from the task, scale a project choice). These were hardcoded in
  # usd_authoring.py and so did NOT move when the scenario was scaled to the
  # robot -- leaving B a 0.45 m box in a 1.0 m corridor, and, because the RTX
  # lidar sees render geometry, an obstacle whose own centre was the delivery
  # goal. B stays a visible prop for P's camera and the viewer either way.
  b_size_xyz_m: [0.45, 0.45, 1.7]
  # A's v1 stand-in. The corridor composer deactivates its visual when the twin
  # is placed (the twin IS A in v2), but the size is authored here so the
  # scenario has no hardcoded lengths left in the actor block.
  a_size_xyz_m: [0.65, 0.45, 0.5]
  # B carries a landmark A can SENSE: a cylindrical post beside B, standing in
  # the lidar's plane. It is the thing that lets A confirm it has arrived at a
  # person rather than at a coordinate, and it is the only measurement of B
  # that survives a diverged map -- it is taken in the laser frame, so it does
  # not care what the map believes.
  #
  # GEOMETRIC, never reflective. A cylinder is circular in section, so it
  # returns an arc of known radius from every bearing, which a flat wall and a
  # convex corner do not. Detecting by RETURN INTENSITY was considered and
  # rejected: sim-vs-real intensity fidelity is an unowned contract question,
  # and a detector that works only in Isaac proves nothing about the robot.
  #
  # The radius is the detector's single source of truth and reaches it through
  # the manifest, never as a second literal.
  landmark_radius_m: 0.15
  landmark_height_m: 0.9
  # BESIDE B along the street, not between B and the street: the post is an
  # obstacle for the same reason B is, so putting it on A's approach line would
  # block the delivery. The offset must also exceed B's half-width + the post's
  # radius + the detector's clustering gap, or the two merge into one cluster
  # and the fit sees a box with a bump instead of a cylinder.
  landmark_offset_m: 0.9

police:
  # P stands inside the next street's east side, on the near (inner) side of
  # its east wall -- the side the supplied diagram measures P's label on, 28
  # of a 358 px clear channel west of the wall. ADR 0019 supersedes ADR 0017,
  # which had placed P beyond that wall's outer face.
  #
  # The placement stays expressed as offsets from wall faces rather than as
  # absolute coordinates, per ADR 0010, so selecting a different (m,n) profile
  # moves P with the geometry instead of stranding it inside a wall.
  body_size_xyz_m: [0.6, 0.6, 1.8]
  # West of the east wall's inner face, so P stands inside the channel.
  east_wall_clearance_m: 0.25
  # South of the north wall's inner face, which is m/2. Closer to that face
  # than ADR 0017's 1.20 m, both because it matches the drawing more closely
  # (P's box sits only 20 px south of the wall's inner line) and because the
  # corner screen (ADR 0019) needs P's whole body north of where A's own path
  # ever reaches, which a larger offset would not leave room for.
  north_offset_m: 0.60
  minimum_clearance_m: 0.25

speed_policy:
  status: demonstration_only
  kind: piecewise_constant_by_clear_width
  # v2 [to pin after first profile run]: ADR 0023 re-pins these limits to
  # robot scale (the fleet robots cap at 0.22 m/s, below every tier here).
  # The values below remain the v1 policy and keep driving the current tests
  # until the measured profile run pins the v2 numbers, under ADR 0007's
  # owner-approval rule and 0016's two-gate no-spare constraint.
  # The strict zone begins at 4.0 m clear width, which is x >= 8 on the nominal
  # taper, so gates 8 and 10 both fall inside it. At the previous 3.5 m only
  # gate 10 did, leaving exactly one measurement in the zone; with a two-estimate
  # confirmation rule a violation confined to the corner could then never be
  # confirmed, and a sustained 1.0 m/s run past the corner reported nothing.
  # Widening the zone rather than weakening confirmation keeps the conservative
  # debounce that stops single noisy frames becoming enforcement events.
  rules:
    - {maximum_width_m: 4.0, limit_mps: 0.8}
    - {maximum_width_m: 5.0, limit_mps: 1.2}
    - {maximum_width_m: 1000.0, limit_mps: 1.5}
  confidence_sigma: 2.0
  consecutive_estimates: 2
