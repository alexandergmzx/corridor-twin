schema_version: 0.1.0
status: provisional_geometry_pending_diagram_reconciliation

stage:
  up_axis: Z
  meters_per_unit: 1.0
  default_prim: /World

geometry:
  corridor_length_m: 12.0
  building_height_m: 4.0
  wall_thickness_m: 0.5
  cross_street_width_m: 6.0
  profiles:
    nominal_m6_n3:
      entry_width_m: 6.0
      corner_width_m: 3.0
      default: true
    wide_corner_m6_n4_5:
      entry_width_m: 6.0
      corner_width_m: 4.5
    uniform_m6_n6:
      entry_width_m: 6.0
      corner_width_m: 6.0

camera:
  count: 1
  frame_id: robot_front_camera_optical_frame
  width_px: 640
  height_px: 360
  rate_hz: 15.0
  horizontal_fov_deg: 75.0
  mount_height_m: 0.7

fiducials:
  dictionary: DICT_5X5_100
  marker_size_m: 0.24
  first_station_m: 2.0
  spacing_m: 2.0
  wall_plate_cant_deg: 35.0

actors:
  # Provisional coordinates are explicit so every artifact is executable. Reconcile
  # them with the supplied interview diagram before freezing design version 1.0.
  a_start_xyz_m: [0.0, 0.0, 0.0]
  b_xyz_m: [15.0, 8.0, 0.0]
  p_bounds_min_xyz_m: [12.7, -5.3, 0.0]
  p_bounds_max_xyz_m: [13.3, -4.7, 1.8]
  delivery_path_xyz_m:
    - [0.0, 0.0, 0.0]
    - [15.0, 0.0, 0.0]
    - [15.0, 8.0, 0.0]

speed_policy:
  status: provisional_demo_only
  kind: piecewise_constant_by_clear_width
  rules:
    - {maximum_width_m: 3.5, limit_mps: 0.8}
    - {maximum_width_m: 5.0, limit_mps: 1.2}
    - {maximum_width_m: 1000.0, limit_mps: 1.5}
  confidence_sigma: 2.0
  consecutive_estimates: 2
