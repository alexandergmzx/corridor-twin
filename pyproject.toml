[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = [
    "test",
    "src/corridor_scene/test",
    "src/police_observer/test",
    "src/corridor_gateway/test",
]
pythonpath = ["src/corridor_scene", "src/police_observer", "src/corridor_gateway"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "install", "log", "out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
